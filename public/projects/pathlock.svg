  <polyline fill="url(#pl-accent)" fill-opacity="0.18" stroke="none"
    points="304,500 374,460 444,484 514,420 584,440 654,376 724,398 794,330 840,348 840,544 304,544"/>
  <g stroke="#312e81" stroke-opacity="0.6" stroke-dasharray="3 4">
    <line x1="304" y1="540" x2="840" y2="540"/>
    <line x1="304" y1="468" x2="840" y2="468"/>
    <line x1="304" y1="396" x2="840" y2="396"/>
  </g>

  <!-- Right widget -->
  <rect x="876" y="284" width="284" height="280" rx="18" fill="url(#pl-card)" stroke="#312e81" stroke-opacity="0.8"/>
  <rect x="896" y="308" width="120" height="14" rx="6" fill="#a5b4fc" opacity="0.7"/>
  <g>
    <rect x="896" y="340" width="244" height="44" rx="10" fill="#312e81" opacity="0.7"/>
    <rect x="912" y="356" width="80" height="12" rx="6" fill="#a78bfa" opacity="0.8"/>
    <rect x="1080" y="356" width="44" height="12" rx="6" fill="#22d3ee" opacity="0.7"/>
    <rect x="896" y="396" width="244" height="44" rx="10" fill="#312e81" opacity="0.7"/>
    <rect x="912" y="412" width="120" height="12" rx="6" fill="#a78bfa" opacity="0.8"/>
    <rect x="1080" y="412" width="44" height="12" rx="6" fill="#22d3ee" opacity="0.7"/>
    <rect x="896" y="452" width="244" height="44" rx="10" fill="#312e81" opacity="0.7"/>
    <rect x="912" y="468" width="100" height="12" rx="6" fill="#a78bfa" opacity="0.8"/>
    <rect x="1080" y="468" width="44" height="12" rx="6" fill="#22d3ee" opacity="0.7"/>
  </g>

  <!-- Bottom table -->
  <rect x="284" y="584" width="876" height="126" rx="18" fill="url(#pl-card)" stroke="#312e81" stroke-opacity="0.8"/>
  <rect x="304" y="608" width="80" height="12" rx="6" fill="#a5b4fc" opacity="0.7"/>
  <g fill="#312e81" opacity="0.7">
    <rect x="304" y="636" width="836" height="22" rx="6"/>
    <rect x="304" y="664" width="836" height="22" rx="6"/>
  </g>

  <text x="56" y="710" font-family="JetBrains Mono, monospace" font-size="14" fill="#a5b4fc" opacity="0.8">pathlock // governance</text>
</svg>
