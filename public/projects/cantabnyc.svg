<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="CantabNYC platform preview">
  <defs>
    <linearGradient id="cn-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#082f49"/>
      <stop offset="1" stop-color="#0c4a6e"/>
    </linearGradient>
    <linearGradient id="cn-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="cn-card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e7490" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#082f49" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#cn-bg)"/>
  <circle cx="980" cy="160" r="220" fill="#22d3ee" opacity="0.18"/>
  <circle cx="220" cy="640" r="200" fill="#0ea5e9" opacity="0.18"/>

  <!-- Nav -->
  <rect x="60" y="48" width="1080" height="56" rx="14" fill="#0e7490" opacity="0.4"/>
  <text x="92" y="84" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700" fill="#e0f2fe">CantabNYC</text>
  <g fill="#bae6fd" opacity="0.9" font-family="Inter, system-ui, sans-serif" font-size="14">
    <text x="780" y="82">Events</text>
    <text x="850" y="82">Members</text>
    <text x="940" y="82">News</text>
    <text x="1000" y="82">About</text>
  </g>
  <rect x="1060" y="62" width="80" height="28" rx="14" fill="url(#cn-accent)"/>

  <!-- Hero copy -->
  <text x="80" y="200" font-family="Inter, system-ui, sans-serif" font-size="56" font-weight="700" fill="#f0f9ff">
    <tspan x="80" dy="0">Where Cambridge</tspan>
    <tspan x="80" dy="64">alumni reconnect.</tspan>
  </text>
  <rect x="80" y="316" width="520" height="14" rx="7" fill="#bae6fd" opacity="0.6"/>
  <rect x="80" y="340" width="380" height="14" rx="7" fill="#bae6fd" opacity="0.5"/>
  <rect x="80" y="380" width="160" height="40" rx="20" fill="url(#cn-accent)"/>
  <rect x="252" y="380" width="140" height="40" rx="20" fill="#0ea5e9" opacity="0.4"/>

  <!-- Event cards -->
  <g>
    <rect x="640" y="160" width="220" height="280" rx="18" fill="url(#cn-card)" stroke="#0ea5e9" stroke-opacity="0.4"/>
    <rect x="660" y="180" width="180" height="120" rx="12" fill="#22d3ee" opacity="0.4"/>
    <rect x="660" y="316" width="120" height="14" rx="7" fill="#e0f2fe" opacity="0.9"/>
    <rect x="660" y="340" width="160" height="10" rx="5" fill="#bae6fd" opacity="0.6"/>
    <rect x="660" y="360" width="100" height="10" rx="5" fill="#bae6fd" opacity="0.5"/>
    <rect x="660" y="396" width="80" height="28" rx="14" fill="url(#cn-accent)"/>

    <rect x="880" y="200" width="240" height="240" rx="18" fill="url(#cn-card)" stroke="#0ea5e9" stroke-opacity="0.4"/>
    <rect x="900" y="220" width="200" height="100" rx="12" fill="#38bdf8" opacity="0.45"/>
    <rect x="900" y="336" width="120" height="14" rx="7" fill="#e0f2fe" opacity="0.9"/>
    <rect x="900" y="360" width="180" height="10" rx="5" fill="#bae6fd" opacity="0.6"/>
    <rect x="900" y="396" width="80" height="28" rx="14" fill="#0ea5e9" opacity="0.5"/>
  </g>

  <!-- Stats strip -->
  <rect x="60" y="500" width="1080" height="160" rx="20" fill="#0e7490" opacity="0.35" stroke="#0ea5e9" stroke-opacity="0.4"/>
  <g font-family="Inter, system-ui, sans-serif" fill="#e0f7fa">
    <text x="120" y="560" font-size="36" font-weight="700">12K+</text>
    <text x="120" y="592" font-size="14" fill="#bae6fd" opacity="0.8">Active alumni</text>

    <text x="380" y="560" font-size="36" font-weight="700">240+</text>
    <text x="380" y="592" font-size="14" fill="#bae6fd" opacity="0.8">Events / yr</text>

    <text x="640" y="560" font-size="36" font-weight="700">98%</text>
    <text x="640" y="592" font-size="14" fill="#bae6fd" opacity="0.8">Satisfaction</text>

    <text x="900" y="560" font-size="36" font-weight="700">24/7</text>
    <text x="900" y="592" font-size="14" fill="#bae6fd" opacity="0.8">Member support</text>
  </g>

  <text x="80" y="720" font-family="JetBrains Mono, monospace" font-size="14" fill="#bae6fd" opacity="0.8">cantabnyc // alumni network</text>
</svg>
