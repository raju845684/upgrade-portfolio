<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="Task Manager preview">
  <defs>
    <linearGradient id="tm-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#022c22"/>
      <stop offset="1" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="tm-accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="tm-card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#065f46" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#022c22" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#tm-bg)"/>
  <circle cx="180" cy="120" r="200" fill="#10b981" opacity="0.18"/>
  <circle cx="1050" cy="650" r="220" fill="#14b8a6" opacity="0.16"/>

  <!-- Top bar -->
  <rect x="60" y="48" width="1080" height="56" rx="14" fill="#065f46" opacity="0.5"/>
  <circle cx="92" cy="76" r="8" fill="url(#tm-accent)"/>
  <text x="116" y="82" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700" fill="#d1fae5">TaskFlow</text>
  <rect x="940" y="62" width="180" height="28" rx="14" fill="url(#tm-accent)"/>

  <!-- Sidebar -->
  <rect x="60" y="124" width="220" height="586" rx="18" fill="url(#tm-card)" stroke="#10b981" stroke-opacity="0.4"/>
  <rect x="84" y="160" width="172" height="36" rx="10" fill="#34d399" opacity="0.35"/>
  <rect x="84" y="208" width="172" height="32" rx="10" fill="#065f46" opacity="0.6"/>
  <rect x="84" y="252" width="172" height="32" rx="10" fill="#065f46" opacity="0.6"/>
  <rect x="84" y="296" width="172" height="32" rx="10" fill="#065f46" opacity="0.6"/>

  <!-- Kanban columns -->
  <g>
    <!-- Column 1 -->
    <rect x="304" y="124" width="276" height="586" rx="18" fill="url(#tm-card)" stroke="#10b981" stroke-opacity="0.3"/>
    <rect x="324" y="148" width="100" height="14" rx="7" fill="#a7f3d0" opacity="0.8"/>
    <rect x="540" y="146" width="20" height="20" rx="10" fill="#34d399" opacity="0.5"/>
    <g>
      <rect x="324" y="184" width="236" height="100" rx="14" fill="#065f46" opacity="0.7"/>
      <rect x="340" y="200" width="160" height="14" rx="7" fill="#d1fae5"/>
      <rect x="340" y="222" width="200" height="10" rx="5" fill="#a7f3d0" opacity="0.7"/>
      <rect x="340" y="240" width="100" height="10" rx="5" fill="#a7f3d0" opacity="0.5"/>
      <rect x="340" y="260" width="60" height="14" rx="7" fill="url(#tm-accent)"/>
    </g>
    <g>
      <rect x="324" y="304" width="236" height="120" rx="14" fill="#065f46" opacity="0.7"/>
      <rect x="340" y="320" width="180" height="14" rx="7" fill="#d1fae5"/>
      <rect x="340" y="342" width="200" height="10" rx="5" fill="#a7f3d0" opacity="0.7"/>
      <rect x="340" y="360" width="160" height="10" rx="5" fill="#a7f3d0" opacity="0.5"/>
      <rect x="340" y="380" width="60" height="14" rx="7" fill="#fbbf24" opacity="0.7"/>
    </g>

    <!-- Column 2 -->
    <rect x="600" y="124" width="276" height="586" rx="18" fill="url(#tm-card)" stroke="#10b981" stroke-opacity="0.3"/>
    <rect x="620" y="148" width="120" height="14" rx="7" fill="#a7f3d0" opacity="0.8"/>
    <g>
      <rect x="620" y="184" width="236" height="140" rx="14" fill="#065f46" opacity="0.7"/>
      <rect x="636" y="200" width="180" height="14" rx="7" fill="#d1fae5"/>
      <rect x="636" y="222" width="200" height="10" rx="5" fill="#a7f3d0" opacity="0.7"/>
      <rect x="636" y="240" width="160" height="10" rx="5" fill="#a7f3d0" opacity="0.5"/>
      <rect x="636" y="280" width="60" height="14" rx="7" fill="#22d3ee" opacity="0.7"/>
    </g>
    <g>
      <rect x="620" y="344" width="236" height="100" rx="14" fill="#065f46" opacity="0.7"/>
      <rect x="636" y="360" width="120" height="14" rx="7" fill="#d1fae5"/>
      <rect x="636" y="382" width="200" height="10" rx="5" fill="#a7f3d0" opacity="0.7"/>
      <rect x="636" y="402" width="60" height="14" rx="7" fill="url(#tm-accent)"/>
    </g>

    <!-- Column 3 -->
    <rect x="896" y="124" width="244" height="586" rx="18" fill="url(#tm-card)" stroke="#10b981" stroke-opacity="0.3"/>
    <rect x="916" y="148" width="80" height="14" rx="7" fill="#a7f3d0" opacity="0.8"/>
    <g>
      <rect x="916" y="184" width="204" height="100" rx="14" fill="#065f46" opacity="0.7"/>
      <rect x="932" y="200" width="160" height="14" rx="7" fill="#d1fae5"/>
      <rect x="932" y="222" width="160" height="10" rx="5" fill="#a7f3d0" opacity="0.7"/>
      <rect x="932" y="260" width="60" height="14" rx="7" fill="#34d399" opacity="0.8"/>
    </g>
  </g>

  <text x="80" y="720" font-family="JetBrains Mono, monospace" font-size="14" fill="#a7f3d0" opacity="0.8">task-manager // mern stack</text>
</svg>
